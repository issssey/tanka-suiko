# 短歌アンチパターンのマスタ。
# - method: rule（同期ルール）/ rule_history（履歴ルール・非同期）/ llm（LLM・非同期）
# - fingerprint: word（コード＋原形）/ segment（コード＋句番号）/ poem（コードのみ）
# - severity: high / medium / low（パターンごとに固定。A1のみ字足らず・字余りで分ける）
# - requiresParent: true のものは初稿では判定しない
# definition / criteria / examples はLLMのプロンプトに使う（ルールのものは説明用）。
version: "2026-11-07.1"

categories:
  A: 定型・リズム
  B: 語彙・表現
  C: 文法・文体
  D: 構成・内容
  E: 推敲の経過

patterns:
  - code: A1
    name: 字余り・字足らず
    method: rule
    phase: sync
    severity: {shortage: high, excess: medium}
    fingerprint: segment
    definition: 句のモーラ数が五七五七七の定型と合わない。
    criteria: 確定した読みのモーラ数を句ごとに定型と比べる。

  - code: A2
    name: 字数合わせの埋め草
    method: llm
    phase: async
    severity: medium
    fingerprint: segment
    definition: 意味の上では不要な語を、音数を合わせるためだけに入れている。
    criteria: その語を除いても意味がほぼ変わらず、主に音数の調整として働いている場合に該当。強調や響きとして機能している場合は非該当。
    positive: ["「とても」「ただ」「そっと」が音数合わせのためだけに置かれている"]
    negative: ["「ただ」が限定の意味をはっきり担っている"]

  - code: A3
    name: 句切れが多い・不明確
    method: llm
    phase: async
    severity: low
    fingerprint: poem
    definition: 一首の中に句切れが三つ以上ある、またはどこで切れるかが読み取りにくい。
    criteria: 終止形・命令形・終助詞・体言止めなどで意味が切れる箇所を数える。三つ以上、または切れ目の解釈が割れる場合に該当。

  - code: A4
    name: 句またがり・句割れ
    method: rule
    phase: sync
    severity: low
    fingerprint: segment
    definition: 一語が二つの句にまたがっている（句またがり）、または句の途中で文が切れている（句割れ）。
    criteria: 形態素の範囲が句の境界をまたぐか、句の途中に文末（句点・終止形＋後続語・終助詞）があるかで判定する。

  - code: B1
    name: 感情語の直接表出
    method: llm
    phase: async
    severity: medium
    fingerprint: word
    definition: 「寂しい」「悲しい」「嬉しい」など、感情そのものを表す語で感情を言っている。
    criteria: 作中主体の感情を感情語で直接述べていれば該当。他者の感情の描写や、感情語が別の意味（比喩・引用）で使われている場合は非該当。
    positive: ["夕暮れの駅のホームで寂しくて", "嬉しくて走り出したる"]
    negative: ["「寂しい」という看板の店"]

  - code: B2
    name: 常套句
    method: llm
    phase: async
    severity: medium
    fingerprint: word
    definition: 使い古された決まり文句をそのまま使っている。
    criteria: 「頬を伝う涙」「満天の星」「時が止まる」「胸が張り裂ける」のように、多くの歌や文章で繰り返された定型表現であれば該当。
    positive: ["頬を伝う涙", "満天の星", "時が止まった"]
    negative: ["定型表現をずらして新しい意味を出している"]

  - code: B3
    name: 月並みな比喩・「〜のように」の多用
    method: llm
    phase: async
    severity: medium
    fingerprint: word
    definition: よく見る比喩をそのまま使っている、または「〜のように」「〜みたいに」が重なっている。
    criteria: 比喩の組み合わせが陳腐（「宝石のような星」「雪のように白い」）か、直喩の標識が二回以上あれば該当。
    positive: ["宝石のような星", "天使のような寝顔"]

  - code: B4
    name: 抽象語の多用
    method: llm
    phase: async
    severity: low
    fingerprint: word
    definition: 「愛」「希望」「未来」「永遠」「心」など、具体物を伴わない抽象語に頼っている。
    criteria: 抽象語が一首に二つ以上あるか、一つでも歌の中心を抽象語だけで支えている場合に該当。

  - code: B5
    name: 既成のオノマトペ
    method: llm
    phase: async
    severity: low
    fingerprint: word
    definition: 「キラキラ」「ドキドキ」「しとしと」など、辞書的で使い古されたオノマトペを使っている。
    criteria: 一般的な擬音語・擬態語をそのままの意味で使っていれば該当。作者独自の音の写し方は非該当。

  - code: B6
    name: 意味の重複
    method: llm
    phase: async
    severity: medium
    fingerprint: segment
    definition: 同じ意味を別の語で繰り返している（重言を含む）。
    criteria: 「白い雪」「夜の闇」「一人ぼっちで孤独」のように、片方の語がもう片方の意味を含んでいれば該当。

  - code: B7
    name: 記号の多用
    method: rule
    phase: sync
    severity: low
    fingerprint: segment
    definition: 「！」「？」「…」「――」などの記号を多く使っている。
    criteria: 本文中の記号（括弧類を含む）の数がしきい値以上なら、記号を含む句ごとに指摘する。
    params:
      minSymbols: 2

  - code: C1
    name: 文語と口語の混在
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    definition: 文語の助動詞・活用と口語の助動詞・活用が一首の中で混ざっている。
    criteria: 「けり」「なり」「たり」「ぬ」などの文語と、「た」「だ」「ている」などの口語が混在していれば該当。意図的な効果が明らかでも、混在していれば該当とする。

  - code: C2
    name: 旧仮名と新仮名の混在
    method: rule
    phase: sync
    severity: high
    fingerprint: poem
    definition: 歴史的仮名遣いと現代仮名遣いが一首の中で混ざっている。
    criteria: 旧仮名の印（ゐ・ゑ、語中語末のハ行表記）と新仮名の印（ワ行五段などで旧仮名ならハ行になる箇所のア行表記）が両方あれば該当。

  - code: C3
    name: 「の」の連続・同じ助詞の反復
    method: rule
    phase: sync
    severity: low
    fingerprint: segment
    definition: 格助詞「の」が短い間に三つ以上続く、または同じ助詞が一首に何度も出る。
    criteria: 「の」が間に三語以内で三つ以上続けば該当。「の」以外の同じ格助詞・係助詞が一首に三回以上出ても該当。
    params:
      noChainMin: 3
      noChainMaxGap: 3
      sameParticleMin: 3

  - code: C4
    name: 時制の揺れ
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    definition: 過去と現在の時制が理由なく揺れている。
    criteria: 一首の中で過去形と現在形が混在し、回想と現在の区別など読みの手がかりがない場合に該当。

  - code: C5
    name: 不要な一人称主語
    method: rule
    phase: sync
    severity: low
    fingerprint: word
    definition: 「私」「僕」「われ」など一人称の主語を書いている。
    criteria: 一人称の代名詞が本文にあれば指摘する（必要かどうかは作者が決める）。
    params:
      pronouns: [私, わたし, わたくし, あたし, 僕, ぼく, 俺, おれ, 我, われ, 吾, 吾れ, われら, 自分]

  - code: D1
    name: 因果の説明
    method: llm
    phase: async
    severity: medium
    fingerprint: word
    definition: 「〜だから」「〜ので」「〜ため」など、理由と結果を説明している。
    criteria: 因果を表す接続語・接続助詞で出来事と感情や行為を結んでいれば該当。該当箇所はその接続語の形態素で示す。

  - code: D2
    name: 結句での種明かし・教訓
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    definition: 結句（五句目）で、上の句の意味をまとめたり、教訓や感想を述べたりしている。
    criteria: 結句が描写ではなく、それまでの内容の解説・総括・教訓になっていれば該当。

  - code: D3
    name: 素材の詰め込みすぎ
    method: llm
    phase: async
    severity: low
    fingerprint: poem
    definition: 一首に場所・時間・人物・行為・感情など素材が多く、焦点がぼやけている。
    criteria: 独立した素材（場面・物・行為）が四つ以上並び、中心が読み取りにくい場合に該当。

  - code: D4
    name: 取り合わせが近すぎる
    method: llm
    phase: async
    severity: low
    fingerprint: word
    definition: 組み合わせた二つの素材が近すぎて、互いに響き合う距離がない。
    criteria: 「桜と春」「雪と冬」のように、一方からもう一方が自然に連想される組み合わせであれば該当。該当箇所は後に出る方の語で示す。

  - code: D5
    name: 視点・場面の分裂
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    definition: 一首の中で視点（誰が見ているか）や場面が途中で切り替わり、まとまらない。
    criteria: 視点人物や時間・場所の切り替えに読みの手がかりがない場合に該当。

  - code: D6
    name: 安易な擬人化
    method: llm
    phase: async
    severity: low
    fingerprint: poem
    definition: 「花が笑う」「風がささやく」など、よくある擬人化をそのまま使っている。
    criteria: 自然物や物に人の動作・感情を与える表現が、ありふれた形であれば該当。

  - code: E1
    name: 具体から抽象への後退
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    requiresParent: true
    definition: 親の版にあった具体的な描写が、推敲で抽象的な語や説明に置き換わった。
    criteria: 親の版と比べ、具体物・固有の動作が抽象語・一般的な語に変わっていれば該当。

  - code: E2
    name: 説明語の増加
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    requiresParent: true
    definition: 推敲で、説明的な語（理由・感情・まとめ）が増えた。
    criteria: 親の版と比べ、因果・感情語・解説の語が増えていれば該当。

  - code: E3
    name: 同じ箇所の行ったり来たり
    method: rule_history
    phase: async
    severity: low
    fingerprint: poem
    requiresParent: true
    definition: 一度消した表現が、後の版で同じ句に戻ってきた。
    criteria: 句ごとの本文を履歴全体で比べ、親の版より前にあった表現が、親の版で消えたあと今回戻っていれば該当。

  - code: E4
    name: 初稿の核の喪失
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    requiresParent: true
    definition: 初稿の中心にあった素材や発見が、推敲の過程でなくなった。
    criteria: 初稿の中心的な素材・場面・発見が今回の版に残っていなければ該当。

  - code: E5
    name: 定型合わせで表現が弱化
    method: llm
    phase: async
    severity: medium
    fingerprint: poem
    requiresParent: true
    definition: 字余り・字足らずを直すために、表現が弱くなった。
    criteria: ルールの結果（A1の変化）として音数が定型に近づいた句について、親の版の表現より具体性や強さが落ちていれば該当。
