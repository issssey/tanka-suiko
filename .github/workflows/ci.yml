# テスト。プルリクエストと、展開の前（deploy.yml から呼ぶ）に動く。
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4  # Firestore エミュレータに必要
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存関係
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
      - name: テスト（メモリ実装）
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: テスト（Firestore エミュレータ）
        run: |
          npm install -g firebase-tools@15
          backend/scripts/test_firestore.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存関係
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: 型チェックとテスト
        working-directory: frontend
        run: |
          npx tsc -b
          npx vitest run
      - name: ビルド
        working-directory: frontend
        run: npx vite build
